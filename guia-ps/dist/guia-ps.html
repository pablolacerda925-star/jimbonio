<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de PS</title><style>/* Guia de PS — lista de doenças e prescrição. Visual mantido do pedido do usuário: fundo bege claro, cartões brancos, verde suave. */
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2a24;--mu:#66726b;--li:#e3dfd4;--vd:#3f8f63;--vd2:#24614a;--vdc:#e4f2e8;--vdb:#a9d4b6;--lar:#b25d12;--larc:#fdf0e3;--az:#2f5f8a;--azc:#eaf1f8;--vm:#a3241b;--vmc:#fde9e7;
  --sh:0 1px 2px rgba(30,40,30,.06),0 4px 14px rgba(30,40,30,.05);--fonte:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--fonte)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit}
.pagina{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 60px}
/* topo da lista */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--li);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topo>*{max-width:980px;margin-inline:auto}
.marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.marca b{font-size:1.15rem;color:var(--vd2)}.marca span{color:var(--mu);font-size:.9rem}
#q{display:block;width:100%;padding:12px 14px;border:1.5px solid var(--vdb);border-radius:12px;background:var(--card);font-size:1rem}#q:focus{outline:none;border-color:var(--vd)}
.grupo{margin-top:22px}
.grupo h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 8px;display:flex;gap:8px;align-items:center}.grupo h2 span{background:var(--li);border-radius:20px;padding:0 8px;letter-spacing:0}
.doencas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.dz{display:block;background:var(--card);border:1px solid var(--li);border-radius:12px;padding:12px 14px;text-decoration:none;font-weight:600;line-height:1.3;box-shadow:var(--sh)}
.dz:hover,.dz:focus-visible{border-color:var(--vd);outline:none}.dz small{display:block;font-weight:400;color:var(--vd2);font-size:.78rem;margin-top:3px}
.vazio{margin-top:30px;color:var(--mu)}.rodape{margin-top:30px;color:var(--mu);font-size:.8rem}
/* doença */
.dh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--li)}
.volta{display:inline-block;color:var(--vd2);font-weight:600;text-decoration:none;padding:4px 0}
.dh h1{font-size:1.45rem;line-height:1.2;margin:4px 0;text-wrap:balance}
.meta{margin:0;color:var(--mu);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sis{background:var(--vdc);color:var(--vd2);border-radius:20px;padding:1px 9px;font-weight:600}
.abas{display:flex;gap:4px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.abas [data-aba]{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--mu);border-bottom:3px solid transparent}.abas .on{color:var(--vd2);border-bottom-color:var(--vd)}
.abas span{font-weight:600;background:var(--li);border-radius:20px;padding:0 7px;font-size:.78rem;margin-left:3px}
.copiar{margin-left:auto;margin-bottom:6px;border:1px solid var(--vdb);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--vd2)}
.conteudo{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.med,.bloco{background:var(--card);border:1px solid var(--li);border-radius:14px;padding:12px 16px;box-shadow:var(--sh);min-width:0}
.med h3{margin:0;font-size:1.05rem;color:var(--vm);line-height:1.3}
.med ul,.bloco ul,.dica ul{list-style:none;margin:6px 0 0;padding:0}
.conteudo li{padding:3px 0 3px calc(var(--i,0) * 14px + 16px);position:relative;line-height:1.45}
.conteudo li::before{content:"";position:absolute;left:calc(var(--i,0) * 14px + 3px);top:.75em;width:6px;height:6px;border-radius:50%;background:var(--vdb)}
.conteudo li.p{padding-left:calc(var(--i,0) * 14px)}.conteudo li.p::before{display:none}
.conteudo li.seta{padding-left:calc(var(--i,0) * 14px + 22px)}.conteudo li.seta::before{content:"→";background:none;width:auto;height:auto;top:.15em;color:var(--vd);font-weight:700}
.conteudo li.forte{font-weight:700;padding-left:calc(var(--i,0) * 14px)}.conteudo li.forte::before{display:none}
.rot{margin:0;color:var(--lar);font-weight:700}
.conteudo li.cab{padding:8px 0 2px;font-weight:700;color:var(--vd2);font-size:.92rem}.conteudo li.cab::before{display:none}.conteudo li.cab:first-child{padding-top:0}
.sub{margin:10px 0 0;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--vd2)}
.dica{background:var(--larc);border-radius:12px;padding:8px 14px}.dica summary{cursor:pointer;color:var(--lar);font-size:.9rem}.dica summary span{color:var(--mu);margin-left:8px}.dica[open] summary{margin-bottom:4px}
.nota{background:var(--azc);border-radius:10px;padding:8px 11px;margin-top:8px;font-size:.9rem}.nota p{margin:0;color:var(--az);font-weight:600}.nota small{color:var(--mu)}.nota a{color:var(--az)}
.nota.al{background:var(--vmc)}.nota.al p{color:var(--vm)}
.ex h3{margin:0 0 4px;font-size:1rem;color:var(--vd2)}.fonte{display:block;color:var(--mu);font-size:.8rem;margin-top:6px}.pg{color:var(--mu);font-size:.78rem;white-space:nowrap}
.semex{background:var(--card);border:1px dashed var(--li);border-radius:14px;padding:16px}.semex p{color:var(--mu);margin:6px 0 0}
.tabw{overflow-x:auto;background:var(--card);border:1px solid var(--li);border-radius:14px;box-shadow:var(--sh)}
.tabw table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}.tabw th,.tabw td{border:1px solid var(--li);padding:7px 9px;text-align:left;vertical-align:top}.tabw th{background:var(--vdc);color:var(--vd2)}
/* medicamentos */
.modos{display:flex;gap:4px;margin-bottom:10px}.modos a{text-decoration:none;font-weight:700;color:var(--mu);padding:7px 14px;border-radius:20px;border:1px solid var(--li);background:var(--card)}.modos a.on{background:var(--vd);border-color:var(--vd);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;background:var(--card);border:1px solid var(--vdb);border-radius:20px;padding:6px 12px;color:var(--vd2)}.chip span{background:var(--vdc);border-radius:20px;padding:0 7px;font-size:.78rem}
.outras{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px}.outras a{font-size:.8rem;font-weight:600;color:var(--vd2);text-decoration:none;background:var(--vdc);border-radius:20px;padding:1px 9px}
.uso{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--li)}.uso:last-child{border-bottom:0}
.uh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.uh a{font-weight:700;font-size:1.05rem;color:var(--vd2);text-decoration:none}.uh small{color:var(--mu);font-size:.8rem}
.ctx{margin:0;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--lar);font-weight:700}
.uso>.fonte{margin-top:-2px}
#copia{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
:focus-visible{outline:2px solid var(--vd);outline-offset:2px}
@media (max-width:520px){.dh h1{font-size:1.25rem}.copiar{margin-left:0}.doencas{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

},{"tipo":"li","t":"Tomar 1 comprimido VO uma vez ao dia, por 7 dias.","ind":1,"pg":104},{"tipo":"med","t":"2) Ciprofloxacino [Cipro®] 500 mg – 20 comprimidos","ind":0,"pg":104},{"tipo":"li","t":"Tomar 1 comprimido VO a cada 12 horas, por 10 dias.","ind":1,"pg":104},{"tipo":"med","t":"3) Amoxicilina + clavulanato [Clavulim®] 875 + 125 mg – 30 comprimidos","ind":0,"pg":104},{"tipo":"li","t":"Tomar 1 comprimido VO a cada 12 horas, por 10 a 14 dias.","ind":1,"pg":104},{"tipo":"p","t":"**Dose pediátrica:** 40 mg/kg/dia a cada 8 horas.","ind":0,"pg":104},{"tipo":"forte","t":"Não complicada por sepse – pacientes internados:","ind":0,"pg":104},{"tipo":"med","t":"1) Levofloxacino [Alevo®] 500 mg/100 mL","ind":0,"pg":104},{"tipo":"li","t":"Administrar 1 bolsa EV a cada 24 horas, por 10 a 14 dias.","ind":1,"pg":104},{"tipo":"med","t":"2) Ciprofloxacino [Cipro®] 400 mg/200 mL","ind":0,"pg":104},{"tipo":"li","t":"Administrar 1 bolsa EV a cada 12 horas, por 10 a 14 dias.","ind":1,"pg":104},{"tipo":"p","t":"**Dose pediátrica:** 20 a 30 mg/kg/dia a cada 12 horas.","ind":0,"pg":105},{"tipo":"med","t":"3) Ceftriaxona [Rocefim®] 1 g","ind":0,"pg":105},{"tipo":"li","t":"Aplicar 1 ampola (1 g) EV a cada 24 horas, por 10 a 14 dias.","ind":1,"pg":105},{"tipo":"forte","t":"Complicada com sepse:","ind":0,"pg":105},{"tipo":"med","t":"1) Piperacilina + tazobactam [Tazocin®] 4 g + 500 mg","ind":0,"pg":105},{"tipo":"li","t":"Administrar EV a cada 8 horas por 10 a 14 dias.","ind":1,"pg":105},{"tipo":"p","t":"**Dose pediátrica:** 300 mg/kg/dia a cada 6 ou 8 horas.","ind":0,"pg":105},{"tipo":"med","t":"2) Cefepima 1 g","ind":0,"pg":105},{"tipo":"li","t":"Administrar EV a cada 12 horas, por 10 a 14 dias.","ind":1,"pg":105},{"tipo":"med","t":"3) Meropeném [Meronem®] 1 g","ind":0,"pg":105},{"tipo":"li","t":"Administrar 1 ampola EV de 8/a cada 8 horas, por 10 a 14 dias.","ind":1,"pg":105}]},{"id":"insuficiencia-cardiaca-descompensada-e-edema-agudo-de-pulmao","nome":"Insuficiência cardíaca descompensada e edema agudo de pulmão","sistema":"Cardiovascular","fonte":"PSZ2","paginas":[18,23],"itens":[{"tipo":"rot","t":"Bizus:","ind":0,"pg":18},{"tipo":"li","t":"O Edema Agudo de Pulmão é atualmente compreendido sob duas abordagens distintas, uma vez que sua causa impacta diretamente no tratamento:","ind":0,"pg":19},{"tipo":"li","t":"**SCAPE** (Simpathetic Crash Acute Pulmonary Edema) refere-se à formação hiperaguda desses sintomas de congestão. O líquido está no local errado, mas o paciente não apresenta excesso de líquido — não está congesto, mas sim em edema agudo. Nesse caso, o tratamento mais eficaz inclui: pressão positiva (VNI) e vasodilatadores dos capilares pulmonares, como o Tridil.","ind":1,"pg":19},{"tipo":"li","t":"**FOSPE** (Fluid Overload Subacute Pulmonary Edema) representa a forma crônica agudizada de um edema agudo de pulmão, típico da insuficiência cardíaca descompensada (IC). Nessa condição, o paciente está congesto e se beneficia da boa e velha furosemida.","ind":1,"pg":19},{"tipo":"li","t":"O **POCUS** (Point of Care Ultrassound) é **altamente benéfico** tanto para o diagnóstico quanto para o seguimento desses pacientes, uma vez que seus achados se alteram antes da radiografia de tórax e apresentam alta sensibilidade e especificidade na avaliação.","ind":0,"pg":19},{"tipo":"li","t":"A abordagem inicial da descompensação da IC deve considerar o perfil do paciente, de acordo com a perfusão e sinais de congestão. As estratégias iniciais incluem:","ind":0,"pg":19},{"tipo":"li","t":"Aumento da diurese (em caso de congestão);","ind":1,"pg":19},{"tipo":"li","t":"Vasodilatação (para reduzir a resistência periférica);","ind":1,"pg":19},{"tipo":"li","t":"Inotropismo (em caso de baixa perfusão periférica), conforme necessidade.","ind":1,"pg":19},{"tipo":"li","t":"Realizar ventilação não invasiva (VNI).","ind":1,"pg":20},{"tipo":"li","t":"A morfina não é mais usada no tratamento do edema agudo do pulmão (EAP) devido à ausência de benefício comprovado, podendo provocar vasodilatação venosa e hipotensão, além possuir meia-vida longa.","ind":1,"pg":20},{"tipo":"li","t":"No manejo inicial da IC no cenário de emergência, a diureticoterapia deve ser realizada por via endovenosa, visto que, em cenário de hipervolemia, a absorção da furosemida por via oral (VO) é imprevisível.","ind":1,"pg":20},{"tipo":"med","t":"Furosemida (20 mg/2 mL) IV","ind":0,"pg":20},{"tipo":"li","t":"**Dose de ataque:** 1,0 a 1,5 mg/kg.","ind":1,"pg":20},{"tipo":"li","t":"Em caso de uso prévio de furosemida, utilizar dose equivalente à utilizada anteriormente (ex.: furosemida VO 40 mg equivale a furosemida EV 20 mg).","ind":1,"pg":20},{"tipo":"li","t":"**Dose de manutenção**: avaliar de acordo com parâmetros de volemia, peso em jejum, diurese e presença de sede.","ind":1,"pg":20},{"tipo":"med","t":"Nitroglicerina [Tridil®] (50 mg/10 mL) IV","ind":0,"pg":20},{"tipo":"li","t":"Diluir 1 ampola (10 mL) em 240 mL SF 0,9%.","ind":1,"pg":20},{"tipo":"seta","t":"Concentração: 200 mcg/mL.","ind":0,"pg":20},{"tipo":"seta","t":"Iniciar infusão em BIC e titular conforme a pressão arterial.","ind":0,"pg":20},{"tipo":"li","t":"Em casos de SCAPE (formação hiperaguda):","ind":1,"pg":20},{"tipo":"p","t":"De acordo com a pressão arterial sistólica (PAS):","ind":0,"pg":20},{"tipo":"li","t":"PAS 160 a 179 mmHg: 3 mL em bolus.","ind":2,"pg":20},{"tipo":"li","t":"PAS 180 a 199 mmHg: 4 mL em bolus.","ind":2,"pg":20},{"tipo":"li","t":"PAS > 200 mmHg: 5 mL em bolus.","ind":2,"pg":20},{"tipo":"p","t":"Não hesitar em iniciar com doses elevadas!","ind":0,"pg":21},{"tipo":"p","t":"**Manutenção:** 30 mL/h.","ind":0,"pg":21},{"tipo":"li","t":"Se PAS estiver diminuindo: manter infusão.","ind":1,"pg":21},{"tipo":"li","t":"Se PAS permanecer igual ou estiver aumentando: aumentar 6mL/h a cada 10 minutos.","ind":1,"pg":21},{"tipo":"p","t":"NÃO REALIZAR ESSAS DOSES EM CENÁRIOS DE HIPERVOLEMIA!","ind":0,"pg":21},{"tipo":"li","t":"Em casos de FOSPE:","ind":1,"pg":21},{"tipo":"li","t":"Iniciar com 5 mL/h e titular conforme resposta pressórica e melhora clínica.","ind":2,"pg":21},{"tipo":"med","t":"Nitroprussiato de Sódio [Nipride®] (50 mg/2 mL) IV","ind":0,"pg":21},{"tipo":"li","t":"Diluir 1 ampola (2 mL) em 248 mL SG 5%.","ind":1,"pg":21},{"tipo":"li","t":"**Concentração:** 200 mcg/mL.","ind":1,"pg":21},{"tipo":"li","t":"Iniciar infusão em BIC a 5 mL/h e titular conforme pressão arterial.","ind":1,"pg":21},{"tipo":"li","t":"**Dose inicial:** 0,25 a 0,5 mcg/kg/min.","ind":1,"pg":21},{"tipo":"li","t":"**Dose máxima:** 10 mcg/kg/min.","ind":1,"pg":21},{"tipo":"forte","t":"OU","ind":0,"pg":21},{"tipo":"li","t":"Diluir 2 ampolas (4 mL) em 246 mL de SG 5%.","ind":1,"pg":21},{"tipo":"li","t":"**Concentração:** 400 mcg/mL","ind":1,"pg":21},{"tipo":"li","t":"Iniciar infusão em BIC a 2 a 3 mL/h e titular conforme pressão arterial.","ind":1,"pg":21},{"tipo":"li","t":"**Dose inicial:** 0,25 a 0,5 mcg/kg/min.","ind":1,"pg":21},{"tipo":"li","t":"**Dose máxima:** 10 mcg/kg/min.","ind":1,"pg":21},{"tipo":"med","t":"Dobutamina (250 mg/20 mL) IV","ind":0,"pg":22},{"tipo":"li","t":"Diluir 4 ampolas (80 mL) em 170 mL SF 0,9%.","ind":1,"pg":22},{"tipo":"li","t":"**Concentração**: 4 mg/mL.","ind":1,"pg":22},{"tipo":"li","t":"Iniciar infusão em BIC a 2 mL/h.","ind":1,"pg":22},{"tipo":"li","t":"**Dose usual:** 2 a 20 mcg/kg/min.","ind":1,"pg":22},{"tipo":"rot","t":"Bizu: com essa concentração, o valor da velocidade de infusão é aproximadamente o mesmo valor numérico da dose usual.","ind":0,"pg":22},{"tipo":"forte","t":"OU","ind":0,"pg":22},{"tipo":"li","t":"Diluir 2 ampolas (40 mL) em 210 mL de SF 0,9%.","ind":1,"pg":22},{"tipo":"li","t":"**Concentração:** 2 mg/mL.","ind":1,"pg":22},{"tipo":"li","t":"Iniciar infusão em BIC a 4 mL/h.","ind":1,"pg":22},{"tipo":"li","t":"**Dose usual:** 2 a 20 mcg/kg/min.","ind":1,"pg":22},{"tipo":"rot","t":"Bizu: com essa concentração, o valor da velocidade de infusão é aproximadamente o dobro do valor numérico da dose usual.","ind":0,"pg":22},{   ["Soro antitetânico (SAT)", "soro antitetanico"], ["Imunoglobulina antitetânica", "imunoglobulina humana antitetanica"], ["Vacina dT", "vacina dt"],
  ["Soro antibotrópico", "antibotropico"], ["Soro anticrotálico", "anticrotalico"], ["Soro antielapídico", "antielapidico"], ["Soro antilaquético", "laquetico"],
  ["Soro antiescorpiônico", "antiescorpionico"], ["Soro antiaracnídico", "antiaracnidico"], ["Soro antilatrodectus", "antilatrodectus"]
];
if (typeof CNP_DOENCAS === "undefined" && typeof require !== "undefined") var CNP_DOENCAS = require("./cnp.js");
EXTRAS.doencas = EXTRAS.doencas.concat(CNP_DOENCAS);
if (typeof module !== "undefined") module.exports = EXTRAS;
</script>
<script id="interface">// INTERFACE — escolher a doença e ver a prescrição e os exames. Nenhum texto clínico aqui: vem de DOENCAS e EXTRAS.
(function () {
  var app = document.getElementById("app");
  var LISTA = DOENCAS.concat(EXTRAS.doencas).sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt"); });
  var ORDEM = ["Cardiovascular", "Trombose e doença vascular", "Neurológico", "Respiratório", "Gastrointestinal", "Endócrino e metabólico", "Hidroeletrolítico", "Infecções", "Infecções de pele", "Geniturinário", "Reprodutor", "Hematológico", "Osteomuscular", "Psiquiatria", "Anafilaxia e alergias", "Intoxicações", "Causas externas", "Hemocomponentes", "Consulta rápida"];
  var FONTES = { PSZ2: "PS Zerado, 2ª edição", PSZ1: "PS Zerado, edição anterior", AHA: "Diretriz AHA 2025", CNP: "Cardiologia na Prática 3.0", MED: "Guia de Prescrições Medway" };
  function noGrupo(d, sis) { return d.sistema === sis || ((EXTRAS.grupos || {})[sis] || []).indexOf(d.id) >= 0; }
  var S = { q: "", aba: "presc", modo: "doencas" };
  var EXAME = /\b(exames?|solicitar|dosar|dosagem|hemograma|gasometria|lactato|hemoculturas?|culturas?|urocultura|ECG|eletrocardiograma|radiografia|tomografia|ultrassom|ultrassonografia|POCUS|ecocardiograma|troponina|D-d[ií]mero|creatinina|eletr[óo]litos|glicemia|cetonemia|coagulograma|INR|bilirrubinas?|amilase|lipase|PCR|VHS|sorologia|NS1|VDRL|hemoglobina|plaquetas|QTc|TTPa|clearance)\b/i;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function plano(s) { return String(s).replace(/\*\*/g, ""); }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function acha(id) { return LISTA.filter(function (d) { return d.id === id; })[0]; }
  function eBizu(t) { return /^#?biz/i.test(t); }
  function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function fonteTxt(d) { if (!d.fonte) return "Sem fonte nos documentos enviados"; return (FONTES[d.fonte] || d.fonte) + (d.paginas ? ", p. " + (d.paginas[0] === d.paginas[1] ? d.paginas[0] : d.paginas[0] + " a " + d.paginas[1]) : ""); }

  // ---------- índice de medicamentos ----------
  // Para cada nome de EXTRAS.farmacos, os trechos de cada doença: o cabeçalho do medicamento, as linhas logo abaixo (dose, diluição, tempo) e a dica que vem colada nele.
  var ESTRUT = { med: 1, sub: 1, tab: 1, rot: 1 };
  // Rótulo curto antes de um medicamento ("Uso oral:", "OU", "+", "Casos leves:") é do medicamento seguinte, não do anterior.
  function cabeca(y) { if (!y || ESTRUT[y.tipo]) return false; var t = plano(y.t).trim(); return t.length < (y.tipo === "forte" ? 90 : 45) && !/\d/.test(t.replace(/^\d+[.)]\s*/, "")) && !/\.$/.test(t); }
  function trecho(d, i) {
    var it = d.itens, r = [it[i]], k = i + 1, j = i - 1, pre = [], ctx = [];
    while (cabeca(it[j])) pre.unshift(plano(it[j--].t).trim());
    for (var s2 = j; s2 >= 0; s2--) if (it[s2].tipo === "sub") { ctx.push(plano(it[s2].t)); break; }
    if (it[j] && it[j].tipo === "rot" && !eBizu(it[j].t) && plano(it[j].t).length < 60) ctx.push(plano(it[j].t));
    pre.forEach(function (t) { if (!/^(ou|\+)$/i.test(t)) ctx.push(t); });
    if (pre.indexOf("+") >= 0) for (var m = i - 1; m >= 0; m--) if (it[m].tipo === "med") { ctx.push("junto com " + plano(it[m].t)); break; }
    while (it[k] && !ESTRUT[it[k].tipo]) r.push(it[k++]);
    if (it[k] && it[k].tipo === "med") {
      var mais = false;
      while (r.length > 1 && cabeca(r[r.length - 1])) mais = plano(r.pop().t).trim() === "+" || mais;
      if (mais) r.push({ tipo: "forte", t: "+ " + it[k].t, ind: 0 });
    } else if (it[k] && it[k].tipo === "rot" && (eBizu(it[k].t) || /^(aten|cuidado|importante)/i.test(it[k].t))) { r.push(it[k++]); while (it[k] && !ESTRUT[it[k].tipo]) r.push(it[k++]); }
    return { ctx: ctx.map(function (t) { return t.replace(/:$/, ""); }).join(" · "), itens: r, pg: it[i].pg };
  }
  var FARM = (EXTRAS.farmacos || []).map(function (f) { return { nome: f[0], re: new RegExp(f[1]), slug: "med-" + slug(f[0]), usos: [] }; });
  LISTA.forEach(function (d) {
    if (d.semFonte) return;
    d.itens.forEach(function (x, i) {
      if (x.tipo !== "med") return;
      var t = norm(plano(x.t));
      FARM.forEach(function (f) {
        if (!f.re.test(t)) return;
        var u = f.usos.filter(function (u) { return u.d === d; })[0];
        if (!u) f.usos.push(u = { d: d, trechos: [] });
        u.trechos.push(trecho(d, i));
      });
    });
  });
  FARM = FARM.filter(function (f) { return f.usos.length; });
  FARM.forEach(function (f) { f.usos.sort(function (a, b) { var ca = a.d.sistema === "Consulta rápida", cb = b.d.sistema === "Consulta rápida"; return ca !== cb ? (ca ? -1 : 1) : a.d.nome.localeCompare(b.d.nome, "pt"); }); });
  var MAIS = FARM.slice().sort(function (a, b) { return b.usos.length - a.usos.length || a.nome.localeCompare(b.nome, "pt"); });
  function farmaco(sl) { return FARM.filter(function (f) { return f.slug === sl; })[0]; }
  function farmacosDe(med) { var t = norm(plano(med)); return FARM.filter(function (f) { return f.re.test(t); }); }
  function achaFarm(n) { return n.length < 3 ? [] : MAIS.filter(function (f) { var a = norm(f.nome); return n.split(/\s+/).every(function (w) { return a.indexOf(w) >= 0; }); }); }

  // ---------- lista ----------
  function casa(d, n) {
    if (!n) return true;
    var alvo = norm(d.nome + " " + d.sistema + " " + (EXTRAS.busca[d.id] || ""));
    if (n.split(/\s+/).every(function (w) { return alvo.indexOf(w) >= 0; })) return true;
    return d.itens.some(function (x) { return x.tipo === "med" && norm(x.t).indexOf(n) >= 0; });
  }
  function nomeNa(d, fs) { var f = fs.filter(function (f) { return f.usos.some(function (u) { return u.d === d; }); })[0]; return f && f.nome; }
  function porMedicamento(d, n) { return n && norm(d.nome + " " + (EXTRAS.busca[d.id] || "")).indexOf(n) < 0; }
  function lista() {
    var n = norm(S.q).trim(), h = "", total = 0, fs = achaFarm(n);
    if (fs.length) h += '<section class="grupo"><h2>Medicamentos <span>' + fs.length + '</span></h2><div class="chips">' + fs.slice(0, 12).map(chip).join("") + "</div></section>";
    ORDEM.forEach(function (sis) {
      var ds = LISTA.filter(function (d) { return noGrupo(d, sis) && casa(d, n); }); total += ds.length;
      if (!ds.length) return;
      h += '<section class="grupo"><h2>' + esc(sis) + ' <span>' + ds.length + "</span></h2><div class=\"doencas\">" + ds.map(function (d) {
        return '<a class="dz" href="#' + d.id + '">' + esc(d.nome) + (porMedicamento(d, n) ? "<small>tem " + esc(nomeNa(d, fs) || S.q) + " na prescrição</small>" : "") + "</a>"; }).join("") + "</div></section>";
    });
    if (!total && fs.length) return h;
    return (h || '<p class="vazio">Nenhuma doença encontrada para "' + esc(S.q) + '". Tente outra palavra ou o nome de um medicamento.</p>') + '<p class="rodape">' + LISTA.length + " doenças · prescrições transcritas do texto dos PDFs, com a página de origem · apoio à decisão, não substitui o julgamento médico</p>";
  }

  function chip(f) { return '<a class="chip" href="#' + f.slug + '">' + esc(f.nome) + "<span>" + f.usos.length + "</span></a>"; }
  function listaMeds() {
    var n = norm(S.q).trim(), fs = n ? FARM.filter(function (f) { var a = norm(f.nome); return n.split(/\s+/).every(function (w) { return a.indexOf(w) >= 0; }); }) : MAIS;
    if (n) fs.sort(function (a, b) { return (norm(b.nome).indexOf(n) === 0) - (norm(a.nome).indexOf(n) === 0) || b.usos.length - a.usos.length; });
    if (!fs.length) return '<p class="vazio">Nenhum medicamento encontrado para "' + esc(S.q) + '". Tente outra grafia ou busque pela doença.</p>';
    return '<section class="grupo"><h2>' + (n ? "Medicamentos" : "Mais usados primeiro") + " <span>" + fs.length + '</span></h2><div class="doencas">' + fs.map(function (f) {
      var nomes = f.usos.map(function (u) { return u.d.nome; });
      return '<a class="dz fm" href="#' + f.slug + '">' + esc(f.nome) + "<small>" + f.usos.length + (f.usos.length === 1 ? " doença" : " doenças") + " · " + esc(nomes.slice(0, 3).join(", ")) + (nomes.length > 3 ? "…" : "") + "</small></a>"; }).join("") + "</div></section>" +
      '<p class="rodape">' + FARM.length + " medicamentos · a dose e a diluição de cada doença são as do guia daquela doença, com a página</p>";
  }

  // ---------- prescrição ----------
  function notasDe(d, med) { return EXTRAS.notas.filter(function (x) { return x.doenca === d.id && x.med.test(med); }); }
  function nota(x) { return '<div class="nota' + (x.alerta ? " al" : "") + '"><p>' + esc(x.t) + (x.ver ? ' <a href="#' + x.ver + '">Abrir</a>' : "") + '</p><small>Fonte: ' + esc(x.ref) + "</small></div>"; }
  function linha(x) {
    var pad = ' style="--i:' + Math.min(x.ind, 4) + '"';
    if (x.tipo === "li") return '<li' + pad + ">" + fmt(x.t) + "</li>";
    if (x.tipo === "seta") return '<li class="seta"' + pad + ">" + fmt(x.t) + "</li>";
    if (x.tipo === "forte") return '<li class="forte"' + pad + ">" + fmt(x.t) + "</li>";
    if (/:$/.test(x.t) && plano(x.t).length < 60 && x.ind === 0) return '<li class="cab"' + pad + ">" + fmt(x.t.replace(/:$/, "")) + "</li>";
    return '<li class="p"' + pad + ">" + fmt(x.t) + "</li>";
  }
  function prescricao(d, semLink) {
    var h = "", aberto = null, dica = null;
    function fecha() { if (aberto) { h += "</ul></div>"; aberto = null; } if (dica) { h += "</ul></details>"; dica = null; } }
    d.itens.forEach(function (x) {
      if (x.tipo === "med") {
        fecha();
        var outros = semLink ? [] : farmacosDe(x.t).filter(function (f) { return f.usos.length > 1; });
        h += '<div class="med"><h3>' + fmt(x.t) + "</h3>" + (outros.length ? '<p class="outras">' + outros.map(function (f) { return '<a href="#' + f.slug + '">' + esc(f.nome) + ": dose em " + (f.usos.length === 2 ? "mais 1 doença" : "outras " + (f.usos.length - 1) + " doenças") + " →</a>"; }).join("") + "</p>" : "") + notasDe(d, plano(x.t)).map(nota).join("") + "<ul>"; aberto = 1; return;
      }
      if (x.tipo === "tab") { fecha(); h += '<div class="tabw"><table>' + x.tab.map(function (r, i) { return "<tr>" + r.map(function (c, j) { var tg = i === 0 || j === 0 ? "th" : "td"; return "<" + tg + ">" + esc(c) + "</" + tg + ">"; }).join("") + "</tr>"; }).join("") + "</table></div>"; return; }
      if (x.tipo === "sub") { fecha(); h += "<h4 class=\"sub\">" + fmt(x.t) + "</h4>"; return; }
      if (x.tipo === "rot") {
        fecha();
        if (eBizu(x.t)) {
          var r = x.t.replace(/^#?biz[uú]s?\s*:?\s*/i, ""), i = d.itens.indexOf(x), prox = r || (d.itens[i + 1] && d.itens[i + 1].tipo !== "med" ? d.itens[i + 1].t : ""), resumo = plano(prox).slice(0, 70);
          h += '<details class="dica"><summary><b>Dica do guia</b>' + (resumo ? "<span>" + esc(resumo) + (plano(prox).length > 70 ? "…" : "") + "</span>" : "") + "</summary><ul>" + (r ? '<li class="p">' + fmt(r) + "</li>" : ""); dica = 1;
        }
        else { h += '<div class="bloco"><p class="rot">' + fmt(x.t) + "</p><ul>"; aberto = 1; }
        return;
      }
      if (!aberto && !dica) { h += '<div class="bloco"><ul>'; aberto = 1; }
      h += linha(x);
    });
    fecha();
    return h;
  }
  function textoPrescricao(d) {
    var L = [d.nome.toUpperCase(), ""], pula = false;
    d.itens.forEach(function (x) {
      if (x.tipo === "rot") { pula = eBizu(x.t); if (!pula) L.push(plano(x.t)); return; }
      if (x.tipo === "med" || x.tipo === "sub") { pula = false; L.push("", plano(x.t)); return; }
      if (x.tipo === "tab") { if (!pula) x.tab.forEach(function (r) { L.push(r.join(" | ")); }); return; }
      if (!pula) L.push(new Array(Math.min(x.ind, 4) + 1).join("  ") + "- " + plano(x.t));
    });
    L.push("", "Fonte: " + fonteTxt(d));
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  // ---------- exames ----------
  function exames(d) {
    var cur = EXTRAS.exames[d.id], cit = d.itens.filter(function (x) { return x.tipo !== "med" && x.tipo !== "tab" && EXAME.test(x.t); }), h = "";
    if (cur) h += '<div class="bloco ex"><h3>Exames</h3><ul>' + cur.itens.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + '</ul><small class="fonte">Fonte: ' + esc(cur.ref) + "</small></div>";
    if (cit.length) h += '<div class="bloco ex"><h3>' + (cur ? "Também citados no guia" : "Citados no texto do guia") + "</h3><ul>" + cit.map(function (x) { return "<li>" + fmt(x.t) + (x.pg ? ' <span class="pg">p. ' + x.pg + "</span>" : "") + "</li>"; }).join("") + "</ul></div>";
    if (!h) h = '<div class="semex"><b>Os documentos enviados não trazem exames para esta doença.</b><p>O PS Zerado é um guia de prescrição. Para completar esta aba é preciso uma fonte de exames (diretriz da sociedade ou protocolo do Ministério da Saúde).</p></div>';
    return h;
  }
  function nEx(d) { var c = EXTRAS.exames[d.id]; return (c ? c.itens.length : 0) + d.itens.filter(function (x) { return x.tipo !== "med" && x.tipo !== "tab" && EXAME.test(x.t); }).length; }

  // ---------- telas ----------
  function doenca(d) {
    var ne = nEx(d);
    return '<div class="dh"><a class="volta" href="#">← Doenças</a><h1>' + esc(d.nome) + '</h1><p class="meta"><span class="sis">' + esc(d.sistema) + "</span>" + esc(fonteTxt(d)) + "</p>" +
      '<div class="abas" role="tablist"><button role="tab" aria-selected="' + (S.aba === "presc") + '" class="' + (S.aba === "presc" ? "on" : "") + '" data-aba="presc">Prescrição</button><button role="tab" aria-selected="' + (S.aba === "ex") + '" class="' + (S.aba === "ex" ? "on" : "") + '" data-aba="ex">Exames <span>' + (ne || "—") + "</span></button>" +
      (S.aba === "presc" ? '<button class="copiar" data-copiar="1">Copiar prescrição</button>' : "") + "</div></div>" +
      '<div class="conteudo">' + (d.semFonte ? '<div class="semex"><b>Ainda sem prescrição.</b><p>' + esc(d.semFonte) + "</p></div>" : S.aba === "presc" ? prescricao(d) : exames(d)) + "</div>" + '<textarea id="copia" aria-hidden="true" tabindex="-1" readonly></textarea>';
  }
  function remedio(f) {
    return '<div class="dh"><a class="volta" href="#medicamentos">← Medicamentos</a><h1>' + esc(f.nome) + '</h1><p class="meta"><span class="sis">' + f.usos.length + (f.usos.length === 1 ? " doença" : " doenças") + "</span>Dose e diluição como no guia de cada doença</p></div>" +
      '<div class="conteudo">' + f.usos.map(function (u) {
        return '<section class="uso"><div class="uh"><a href="#' + u.d.id + '">' + esc(u.d.nome) + ' <span>→</span></a><small>' + esc(u.d.sistema) + "</small></div>" + u.trechos.map(function (t) {
          return (t.ctx ? '<p class="ctx">' + esc(t.ctx) + "</p>" : "") + prescricao({ id: u.d.id, itens: t.itens }, true) + '<small class="fonte">' + esc(FONTES[u.d.fonte] || u.d.fonte) + (t.pg ? ", p. " + t.pg : "") + "</small>"; }).join("") + "</section>";
      }).join("") + "</div>";
  }
  function render() {
    var id = decodeURIComponent(location.hash.slice(1)), d = id && acha(id), f = id && farmaco(id);
    if (d) { app.innerHTML = '<div class="pagina">' + doenca(d) + "</div>"; return; }
    if (f) { app.innerHTML = '<div class="pagina">' + remedio(f) + "</div>"; return; }
    S.modo = id === "medicamentos" ? "meds" : "doencas";
    var m = S.modo === "meds";
    app.innerHTML = '<header class="topo"><div class="marca"><b>Guia de PS</b><span>Prescrição e exames por doença</span></div>' +
      '<nav class="modos"><a href="#" class="' + (m ? "" : "on") + '">Doenças</a><a href="#medicamentos" class="' + (m ? "on" : "") + '">Medicamentos</a></nav>' +
      '<input id="q" type="search" autocomplete="off" placeholder="' + (m ? "Buscar medicamento (ex.: noradrenalina, ceftriaxona)" : "Buscar doença, sigla ou medicamento (ex.: TEP, ITU, adenosina)") + '" value="' + esc(S.q) + '"></header><main id="lista" class="pagina">' + (m ? listaMeds() : lista()) + "</main>";
  }

  // ---------- eventos ----------
  window.addEventListener("hashchange", function () { S.aba = "presc"; render(); window.scrollTo(0, 0); });
  app.addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value; document.getElementById("lista").innerHTML = S.modo === "meds" ? listaMeds() : lista(); } });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-aba]"); if (b) { S.aba = b.dataset.aba; render(); return; }
    var c = e.target.closest("[data-copiar]");
    if (c) {
      var d = acha(decodeURIComponent(location.hash.slice(1))), ta = document.getElementById("copia"); ta.value = textoPrescricao(d);
      var ok = function () { c.textContent = "Copiado"; setTimeout(function () { c.textContent = "Copiar prescrição"; }, 1800); };
      try { navigator.clipboard.writeText(ta.value).then(ok, function () { ta.select(); ok(); }); } catch (x) { ta.select(); ok(); }
    }
  });
  render();
})();
</script>
