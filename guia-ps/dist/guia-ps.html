<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de PS</title><style>:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2a24;--mu:#6b766f;--li:#e3e0d7;--vd:#3f8f63;--vd2:#24614a;--vdc:#e4f2e8;--vdb:#a9d4b6;--am:#fff6df;--amb:#e7c46a;--vm:#b3261e;--vmc:#fde9e7;--sh:0 1px 2px rgba(30,40,30,.06),0 4px 14px rgba(30,40,30,.06)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.centro{flex:1;min-width:0;padding:0 18px 70px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--li)}
.pid{display:flex;gap:6px;align-items:center;font-size:1.05rem}.pid span{color:var(--tx)}.pid small{color:var(--mu);font-size:.75rem;margin-left:6px;text-decoration:underline}

.doen{display:flex;gap:8px;flex-wrap:wrap}

.no.feito{background:#f7fcf8;border-color:var(--vdb)}
.no.atual{border:2px solid var(--vd);box-shadow:0 0 0 4px rgba(63,143,99,.12),var(--sh)}
.no.cond{border-left:4px solid var(--vd);width:470px}.no.verm{border-color:#efb4ad;background:#fffafa}.no.al{background:var(--am);border-color:var(--amb)}.no.cinza{background:#faf9f6;box-shadow:none;border-style:dashed}
.no.cls{background:var(--vdc);border-color:var(--vdb)}
.no.hip{border-width:2px}.no.hip.forte{border-color:var(--vd);background:#f3faf5}.no.hip.media{border-color:var(--vdb)}.no.hip.fraca{opacity:.7}

.noh b{flex:1;font-size:.95rem;line-height:1.25}
.nic{width:28px;height:28px;border-radius:50%;background:#f0eee8;display:grid;place-items:center;color:var(--mu);flex:none}.feito .nic{background:var(--vd);color:#fff}.atual .nic{background:var(--vdc);color:var(--vd2)}.al .nic{background:#fbe7b2;color:#7a5600}
.bdg{font-size:.7rem;font-weight:700;border-radius:20px;padding:2px 8px;background:#efede6;color:var(--mu);white-space:nowrap}.feito .bdg{background:var(--vdc);color:var(--vd2)}.bdg.ag{background:var(--vd);color:#fff}
.abre{color:var(--mu);font-weight:700;width:18px;text-align:center}
.nob{margin-top:8px}
.nod{margin-top:10px;padding-top:10px;border-top:1px dashed var(--li)}
.chs{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.ch{font-size:.8rem;background:var(--vdc);color:var(--vd2);border-radius:20px;padding:3px 9px}.ch.neg{background:#eeece6;color:var(--mu);text-decoration:line-through}.ch.v{background:var(--vmc);color:var(--vm)}
.ch.b{background:#fff;border:1px solid var(--li);color:var(--tx)}.ch.b.on{background:var(--vd2);border-color:var(--vd2);color:#fff}
.mini-t{font-size:.82rem;color:var(--mu);margin:4px 0}.dica{font-size:.84rem;color:var(--mu);margin:4px 0 8px}
.sn,.sn3{display:inline-flex;gap:5px}.sn .b,.sn3 .b{padding:5px 12px;min-height:32px}
.ops{display:flex;flex-wrap:wrap;gap:5px}.ops .b{padding:6px 10px;min-height:32px;font-size:.84rem}
.ck{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:4px 0;font-size:.88rem}.ck i{width:18px;height:18px;border-radius:5px;border:1.5px solid #b7b3a8;flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem;margin-top:1px}.ck i svg{width:12px;height:12px;stroke-width:3}

.ck.rep i{border-radius:50%;width:22px;height:22px;border-color:var(--vd);color:var(--vd);font-weight:700;font-size:.75rem}.ck.rep.on i{color:#fff}.ck.rep span{color:var(--tx)!important}
.numl{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}.numl .ck{flex:1;width:auto}
.ord{flex:none;width:24px;height:24px;border-radius:50%;background:var(--vd2);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
.agora{background:#eef6f1;border-radius:10px;padding:6px 9px;font-size:.86rem;margin:4px 0 8px;color:var(--vd2);font-weight:600}
.aviso-i{background:var(--am);border-radius:8px;padding:5px 8px;font-size:.8rem;margin:6px 0}
.medl{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--vdb);border-radius:12px;padding:8px 9px;margin:6px 0;background:#fff}.medl:hover{background:var(--vdc)}.medl.ok{background:#f3faf5}.medl.nao{opacity:.6}
.mt{flex:1;min-width:0}.mt b{display:flex;gap:5px;align-items:center;font-size:.9rem}.mt b svg{width:15px;height:15px;color:var(--vd)}.mt span{display:block;font-size:.86rem;font-weight:600;margin-top:2px}.mt small{display:block;color:var(--mu);font-size:.76rem}
.medl{flex-wrap:wrap}.ms{display:flex;align-items:center;gap:6px;flex-basis:100%;padding-left:32px}.ms em{font-style:normal;font-size:.72rem;color:var(--vd2);font-weight:600;white-space:nowrap}
.bol{display:inline-flex;gap:3px}.bol i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--vd)}.bol i.on{background:var(--vd)}

.sub{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--mu);margin:14px 0 4px}
.det-it{padding:6px 0;border-bottom:1px solid #f0eee8}.det-it:last-child{border-bottom:0}

.infs{display:inline-flex;gap:2px}
.pg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid #f0eee8}.pg.ok .lt{color:var(--mu)}
.como{margin:6px 0 2px;padding-left:18px;font-size:.86rem}.como li{margin:2px 0}
.fonte{font-size:.75rem;color:var(--mu);font-style:italic;margin:4px 0}
.kv{margin:4px 0;font-size:.88rem}.kv small{display:block;font-size:.68rem;font-weight:700;color:var(--mu);letter-spacing:.04em}
.cmp{width:100%;padding:7px 10px;border:1px solid var(--li);border-radius:9px;margin-top:6px;background:#fff}
.err{color:var(--vm);background:var(--vmc);border-radius:8px;padding:5px 8px;font-size:.82rem;margin:5px 0}
.vazio{text-align:center;padding-top:16vh}.logo-g{color:var(--vd)}.logo-g svg{width:44px;height:44px}.vazio p{color:var(--mu)}

.fundo{position:fixed;inset:0;background:rgba(25,35,30,.35);z-index:20}
.modal{position:fixed;z-index:21;top:0;right:0;bottom:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);width:min(440px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);border-radius:16px 0 0 16px}.modal.largo{width:min(700px,100%)}
.mh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--li)}.mh div{flex:1}.mh p{margin:3px 0 0;font-size:.84rem;color:var(--mu)}
.x{font-size:1.6rem;line-height:1;padding:0 6px;color:var(--mu)}.mb{padding:6px 16px 24px;overflow:auto;flex:1}.mb ul{margin:0;padding-left:18px;font-size:.88rem}.mb li{margin:3px 0}
.plano{display:flex;flex-wrap:wrap;background:var(--vdc);border-radius:12px;margin-top:10px;overflow:hidden}.plano p{margin:0;flex:1;min-width:120px;padding:8px 10px;font-weight:700;font-size:.9rem}.plano small{display:block;font-size:.68rem;color:var(--vd2);letter-spacing:.04em}
.calc{background:var(--bg);border-radius:12px;padding:10px}.calc>p{margin:8px 0 4px;font-size:.78rem;font-weight:700;color:var(--mu)}
.campos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.campos label{font-size:.72rem;font-weight:700;color:var(--mu);display:flex;flex-direction:column;flex:1;min-width:95px}.campos input{padding:7px 9px;border:1px solid var(--li);border-radius:9px;background:#fff}
.resc{background:#fff;border:1px solid var(--vdb);border-radius:12px;padding:6px 12px;margin-top:10px}.resc p{margin:5px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.resc small{color:var(--mu);font-size:.78rem}.resc b{text-align:right}.resc p.pri b{font-size:1.3rem;color:var(--vd2)}
.resc .form{display:block;font-size:.74rem;color:var(--mu);border-top:1px dashed var(--li);padding-top:5px}
.faltac{background:var(--am);border-radius:8px;padding:6px 9px;margin:10px 0 0;font-size:.84rem}
.mais{margin-top:14px;font-size:.88rem}.mais summary{cursor:pointer;color:var(--vd2);font-weight:600}
.tl{list-style:none;padding:0!important}.tl i{font-style:normal;font-weight:700;color:var(--vd2);margin-right:4px}
textarea#pass{width:100%;border:1px solid var(--li);border-radius:12px;padding:10px;margin:10px 0;font-size:.9rem;line-height:1.45}

  .lay{flex-direction:column}.rail{width:100%;height:auto;flex-direction:row;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:6px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--li)}.logo{margin:0 4px 0 0}
  .centro{padding:0 12px 60px}.busca{margin-left:0;width:100%}.acts{margin-left:0}

  .modal,.modal.largo{width:100%;border-radius:0}}

  // ---------- medicamento e calculadora ----------
  function abreMed(id) {
    var m = F.meds[id], p = pac(), u = p && ult(p, "peso");
    S.calc = { peso: u ? vg(u.v) : "", dose: m.doses && m.doses.length === 1 ? m.doses[0] : null, ap: m.aps && m.aps.length === 1 && m.modo !== "inf" ? 0 : null, faixa: m.faixas ? 0 : null, amp: "", apMg: "", apMl: "", dil: "", d: "", uso: null, oral: "" };
    S.modal = { tipo: "med", id: id }; S.q = ""; S.merro = "";
    if (p && medsDe(tm(p.tema)).indexOf(id) >= 0) { var st = D(p).med[id] || (D(p).med[id] = {}); if (!st.cons) { st.cons = Date.now(); log(p, "Consultado: " + m.nome); } }
  }
  function calcular(m, c) {
    var falta = [], L = [], Fm = [], ap = c.ap != null && m.aps ? m.aps[c.ap] : null, peso = CALC.num(c.peso), pesoOk = peso !== null && peso >= 20 && peso <= 300;
    if (m.modo === "txt") return { txt: m.dose[0] };
    if (m.modo === "fixo" || m.modo === "furo") {
      var dose = c.dose;
      if (m.modo === "furo") { if (!c.uso) falta.push("uso prévio de diurético"); else if (c.uso === "s" && CALC.num(c.oral) === null) falta.push("dose oral diária (mg)"); }
      if (dose == null) falta.push("dose"); if (!ap) falta.push("apresentação da ampola");
      if (falta.length) return { falta: falta };
      if (m.teto && dose > m.teto) return { erro: "Dose acima do teto documentado (" + m.teto + " mg por dia)." };
      var b = CALC.bolus(dose, ap, null);
      L = [["Dose", rotDose(m, dose)], ["Volume a aspirar", vg(b.volMl) + " mL"], ["Ampolas", b.ampolas + " de " + ap.t]];
      Fm = ["Volume = dose ÷ concentração da ampola = " + vg(dose) + " mg ÷ " + vg(CALC.r(ap.mg / ap.ml, 3)) + " mg/mL = " + vg(b.volMl) + " mL"];
      return { L: L, F: Fm, txt: rotDose(m, dose) + " (" + vg(b.volMl) + " mL)" };
    }
    if (m.modo === "kg") {
      if (!pesoOk) falta.push("peso (20 a 300 kg)"); if (!ap) falta.push("apresentação da ampola");
      if (falta.length) return { falta: falta };
      var fx = m.faixas[c.faixa], k = CALC.bolusKg(fx.mgKg, c.peso, ap.mg / ap.ml);
      L = [["Dose (" + fx.t + ")", vg(k.mg[0]) + " a " + vg(k.mg[1]) + " mg"], ["Volume a aspirar", vg(k.ml[0]) + " a " + vg(k.ml[1]) + " mL"]];
      Fm = ["Dose = " + vg(fx.mgKg[0]) + " a " + vg(fx.mgKg[1]) + " mg/kg × " + vg(peso) + " kg", "Volume = dose ÷ " + vg(ap.mg / ap.ml) + " mg/mL"];
      return { L: L, F: Fm, txt: fx.t + ": " + vg(k.mg[0]) + " a " + vg(k.mg[1]) + " mg (" + vg(k.ml[0]) + " a " + vg(k.ml[1]) + " mL)" };
    }
    var n = CALC.num(c.amp), mg = CALC.num(c.apMg), ml = CALC.num(c.apMl), dil = CALC.num(c.dil), ds = CALC.num(c.d);
    if (n === null) falta.push("número de ampolas"); if (mg === null) falta.push("mg por ampola"); if (ml === null) falta.push("mL por ampola"); if (dil === null) falta.push("volume do diluente (mL)");
    if (m.porKg && !pesoOk) falta.push("peso (20 a 300 kg)");
    if (falta.length) return { falta: falta };
    var pr = CALC.preparo({ mg: mg, ml: ml }, { amp: n, dil: dil });
    L = [["Concentração final", vg(CALC.r(pr.mcgMl, 1)) + " mcg/mL (" + vg(CALC.r(pr.mgMl, 3)) + " mg/mL)"], ["Volume final", vg(pr.volFinal) + " mL = " + vg(pr.volDroga) + " mL do medicamento + " + vg(dil) + " mL de diluente"]];
    Fm = ["Concentração = (" + vg(n) + " × " + vg(mg) + " mg) ÷ " + vg(pr.volFinal) + " mL"];
    if (ds === null) return { L: L, F: Fm, falta: ["dose (" + m.un + ")"] };
    if (m.max && ds > m.max) return { L: L, F: Fm, erro: "Dose acima do máximo documentado (" + vg(m.max) + " " + m.un + ")." };
    var v;
    if (m.un === "mg/h") { v = CALC.infusaoMgH(ds, pr.mgMl, null).mlH; Fm.push("Velocidade = dose ÷ concentração = " + vg(ds) + " mg/h ÷ " + vg(CALC.r(pr.mgMl, 3)) + " mg/mL"); }
    else { var mcg = ds * (m.fator || 1); v = CALC.infusao(mcg, c.peso, pr.mcgMl, m.porKg, null).mlH; Fm.push("Velocidade = dose" + (m.porKg ? " × peso" : "") + " × 60 ÷ concentração = " + vg(mcg) + " mcg" + (m.porKg ? "/kg/min × " + vg(peso) + " kg" : "/min") + " × 60 ÷ " + vg(CALC.r(pr.mcgMl, 1)) + " mcg/mL"); }
    L.unshift(["Velocidade de infusão", vg(v) + " mL/h"], ["Dose", vg(ds) + " " + m.un + (m.porKg ? " × " + vg(peso) + " kg" : "")]);
    return { L: L, F: Fm, txt: vg(ds) + " " + m.un + " = " + vg(v) + " mL/h (solução de " + vg(CALC.r(pr.mcgMl, 1)) + " mcg/mL)" };
  }
  function calcHtml(m) {
    var r = calcular(m, S.calc), h = "";
    if (r.L) h += '<div class="resc">' + r.L.map(function (l, i) { return "<p" + (i === 0 || l[0] === "Volume a aspirar" ? ' class="pri"' : "") + "><small>" + esc(l[0]) + "</small><b>" + esc(l[1]) + "</b></p>"; }).join("") + '<p class="form">' + r.F.map(esc).join("<br>") + "</p></div>";

  function modalMed() {

        if (ds.length) h += "<p>Dose</p>" + chips("cdose", ds.map(function (d) { return [d, vg(d) + " mg"]; }), c.dose); }
      if (m.modo === "fixo" && m.doses.length > 1) h += "<p>Dose</p>" + chips("cdose", m.doses.map(function (d) { return [d, rotDose(m, d)]; }), c.dose);
      if (m.modo === "kg") h += "<p>Dose</p>" + chips("cfaixa", m.faixas.map(function (f, i) { return [i, f.t + ": " + vg(f.mgKg[0]) + " a " + vg(f.mgKg[1]) + " mg/kg"]; }), c.faixa) + '<div class="campos">' + campo("peso", "Peso (kg)") + "</div>";
      if (m.modo !== "inf") h += "<p>Ampola disponível</p>" + chips("cap", m.aps.map(function (a, i) { return [i, a.t]; }), c.ap);
      else h += "<p>Preparo do documento (toque para preencher)</p>" + chips("cprep", m.preps.map(function (x, i) { return [i, x.t]; }), c.prep) +
        '<div class="campos">' + campo("amp", "Nº de ampolas") + campo("apMg", "mg por ampola") + campo("apMl", "mL por ampola") + campo("dil", "Diluente (mL)") + (m.porKg ? campo("peso", "Peso (kg)") : "") + "</div>" +
