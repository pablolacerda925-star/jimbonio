<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de PS</title><style>:root{--bg:#fbf7f2;--fg:#14110f;--mut:#6b645d;--lin:#d9d2c9;--ver:#0f6b5a;--verc:#e3f1ec;--card:#fff;--al:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#f2efea;--mut:#a9a39b;--lin:#3a3f45;--ver:#3fb39a;--verc:#17332d;--card:#1d2226;--al:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--lin);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:3}
.marca{font-weight:800;font-size:1.25rem;border:0;background:none;color:var(--fg);padding:6px 4px;cursor:pointer}
#q{flex:1 1 200px;min-height:48px;border:1px solid var(--lin);border-radius:10px;padding:0 14px;font:inherit;background:var(--card);color:var(--fg)}
.novo{border:0;background:none;color:var(--ver);font:inherit;font-weight:700;min-height:48px;cursor:pointer}
#res{max-width:680px;margin:0 auto;padding:0 16px}.pac,.lem{max-width:680px;margin:8px auto 0;padding:8px 16px;font-size:.95rem}.pac{color:var(--mut)}.lem{background:#fff3d6;color:#5b4100;border-radius:10px;font-weight:600}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}h1{font-size:2.1rem;line-height:1.1;margin:.3em 0 .6em}h2{font-size:1.9rem;line-height:1.15;margin:.5em 0 .5em}
.mig{color:var(--mut);margin:0 0 10px;font-size:.95rem}.prog{display:flex;gap:6px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--lin)}.prog i.on{background:var(--ver)}
.etapa{color:var(--mut);font-size:.95rem;margin:8px 0 0}.rot{color:var(--mut);font-size:.9rem;margin:18px 0 6px;font-weight:600}.fraco{color:var(--mut);font-size:.95rem;margin:4px 0 10px}
.op{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:66px;margin:12px 0;padding:10px 22px;border-radius:12px;border:1.5px solid var(--ver);background:var(--ver);color:#fff;font:inherit;font-size:1.3rem;font-weight:700;text-align:left;cursor:pointer}
.op.sec{background:var(--card);color:var(--fg);border-color:var(--lin)}.op small{font-weight:500;font-size:.8rem;opacity:.85;margin-left:auto}.op span{font-size:1.5rem}
.pils{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.pil{min-height:50px;padding:8px 16px;border-radius:99px;border:1.5px solid var(--lin);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.pil.on{background:var(--verc);border-color:var(--ver);color:var(--ver)}.pil.est{font-weight:500;min-height:40px;display:inline-flex;align-items:center;font-size:.95rem}
.pil.gr{border-radius:14px;min-width:130px;display:flex;flex-direction:column;align-items:flex-start;padding:10px 16px}.pil.gr b{font-size:1.4rem}.pil.gr small{color:var(--mut)}.pil:disabled{opacity:.5}
.num{width:100%;min-height:58px;border:1.5px solid var(--lin);border-radius:12px;padding:0 16px;font:inherit;font-size:1.2rem;background:var(--card);color:var(--fg);margin:6px 0}.num.big{font-size:1.8rem;min-height:72px}
.linha{margin:4px 0;font-size:1.05rem}.linha.al{color:var(--al);font-size:.95rem}.grande{font-size:1.5rem;font-weight:600;margin:6px 0}
.dose{background:var(--verc);border-radius:14px;padding:12px 18px;margin:12px 0}.dose small{display:block;color:var(--ver);font-weight:700}.dose b{font-size:2.2rem;line-height:1.1}.dose.m{background:none;border:1.5px solid var(--lin)}.dose.m b{font-size:1.5rem}
.uti{background:var(--al);color:#fff;font-weight:800;border-radius:10px;padding:6px 14px;display:inline-block;margin-top:12px}.err{color:var(--al);font-weight:700;margin:6px 0}
.lk{border:0;background:none;color:var(--ver);font:inherit;font-weight:600;text-decoration:underline;min-height:44px;padding:6px 0;cursor:pointer}.lk.on{color:var(--fg)}
.pe{display:flex;justify-content:space-between;border-top:1px solid var(--lin);margin-top:26px;padding-top:6px}.pe .lk{text-decoration:none;color:var(--fg);font-weight:500}
.gav{padding:6px 0}.gav p{margin:6px 0;font-size:.95rem}textarea{width:100%;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--lin);border-radius:10px;padding:10px;background:var(--card);color:var(--fg)}
</style></head>

<script id="conteudo-do-fluxo">// CONTEÚDO DO FLUXO — separado da interface. Uma conduta por passo.
// Regra de escolha: resolução já aprovada por você; na dúvida, PS Zerado 2ª edição.
// ---------- Lote 1: peças repetidas do algoritmo de PCR (AHA 2025) ----------
var R_PCR = "AHA 2025, Figura 2 (ACLS-F p. 2)";
function pcrRitmo(choc, nao) {
  return { e: 1, tipo: "pergunta", t: "Depois de 2 min de RCP: ritmo chocável?", ops: [
    { t: "Sim · FV ou TV sem pulso", log: "Ritmo chocável", ir: choc },
    { t: "Não · assistolia ou AESP", sec: 1, log: "Ritmo não chocável", ir: nao },
    { t: "Voltou o pulso", sec: 1, log: "Retorno da circulação espontânea", ir: "rosc" },
    { t: "Encerrar os esforços", sec: 1, log: "Avaliado encerrar os esforços", ir: "parar" }], ref: R_PCR };
}
function pcrChoque(primeiro, ir) {
  return { e: 2, tipo: "acao", t: "Choque", linhas: [primeiro ? "Bifásico: 120 a 200 J (não sabe? o máximo)" : "Bifásico: mesma energia ou maior", "Monofásico: 360 J", "Voltar à RCP na hora, por 2 min"],
    ops: [{ t: "Choquei", log: "Choque", ir: ir }], ref: R_PCR };
}
var FLUXO = {
  versao: "0.3.0-lote1", data: "2026-11-11",
  temas: [{
    id: "pcr", nome: "Parada cardiorrespiratória", curto: "PCR",
    busca: ["pcr", "parada", "parada cardiaca", "parada cardiorrespiratoria", "rcp", "fv", "fibrilacao ventricular", "tv sem pulso", "assistolia", "aesp", "sem pulso", "desfibrilacao", "choque"],
    imediato: 1,
    etapas: ["RCP", "Ritmo", "Choque e drogas", "Causas", "Depois"],

      ritmo1: { e: 1, tipo: "pergunta", t: "Ritmo chocável?", ops: [{ t: "Sim · FV ou TV sem pulso", log: "Ritmo inicial chocável", ir: "ch1" }, { t: "Não · assistolia ou AESP", sec: 1, log: "Ritmo inicial não chocável", ir: "adrN" }], ref: R_PCR },
      // ramo chocável
      ch1: pcrChoque(1, "acesso"),
      acesso: { e: 2, tipo: "acao", t: "RCP por 2 min", linhas: ["Acesso EV ou IO", "Trocar quem comprime a cada 2 min"], ops: [{ t: "Passou 2 min", ir: "ritmo2" }], ref: R_PCR },
      ritmo2: pcrRitmo("ch2", "adrN"),
      ch2: pcrChoque(0, "adrA"),
      adrA: { e: 2, tipo: "med", med: "adrenalinaPcr", ir: "ritmo3" },
      ritmo3: pcrRitmo("ch3", "adrN"),
      ch3: pcrChoque(0, "amio1"),
      amio1: { e: 2, tipo: "med", med: "amiodaronaPcr1", sem: "lido1", ir: "causasC" },
      lido1: { e: 2, tipo: "med", med: "lidocainaPcr1", ir: "causasC" },
      causasC: { e: 3, tipo: "acao", t: "Procure a causa", chips: ["Hipovolemia", "Hipóxia", "Acidose", "Potássio alto ou baixo", "Hipotermia", "Pneumotórax hipertensivo", "Tamponamento", "Intoxicação", "Embolia pulmonar", "Infarto"],
        ops: [{ t: "Continuar", ir: "ritmo4" }], ref: R_PCR },
      ritmo4: pcrRitmo("ch4", "adrN"),

        ops: [{ t: "Continuar", ir: "ritmoN2" }], ref: R_PCR },

      // instável: cardioversão
      iRitmo: { e: 1, tipo: "pergunta", t: "Qual o ritmo?", ops: [

      cv100: { e: 2, tipo: "acao", t: "Cardioversão sincronizada: 100 J", linhas: ["Sedar se der", "Sincronizar de novo a cada choque"], ops: [{ t: "Reverteu", log: "Cardioversão sincronizada 100 J: reverteu", ir: "destino" }, { t: "Não reverteu", sec: 1, log: "Cardioversão sincronizada 100 J: não reverteu", ir: "cvMais" }], ref: "AHA 2025, Figura 7 (ACLS-F p. 5)" },
      cvMais: { e: 3, tipo: "acao", t: "Aumente a energia e repita", linhas: ["Procurar a causa", "Chamar o cardiologista"], ops: [{ t: "Reverteu", log: "Reverteu com energia maior", ir: "destino" }, { t: "Segue em taquicardia", sec: 1, log: "Refratária à cardioversão", ir: "destino" }], ref: "AHA 2025, Figura 6 (ACLS-F p. 4)" },
      desf: { e: 2, tipo: "acao", t: "Desfibrilar agora", linhas: ["Choque não sincronizado", "Energia máxima do aparelho"], ops: [{ t: "Choquei", log: "TV polimórfica: desfibrilação", ir: "qt" }], ref: "AHA 2025, TV polimórfica (ACLS-T p. 3-4)" },

      torsades: { e: 3, tipo: "acao", t: "Torsades", linhas: ["Sulfato de magnésio EV", "Corrigir o potássio", "Suspender droga que alonga o QT"], ops: [{ t: "Feito", log: "Torsades: magnésio, potássio e revisão de drogas", ir: "destino" }], ref: "AHA 2025, TV polimórfica (ACLS-T p. 3-4)" },

        { t: "Largo, regular, monomórfico", sec: 1, log: "QRS largo, regular e monomórfico", ir: "largo" }, { t: "Largo e irregular", sec: 1, log: "QRS largo e irregular", ir: "largoIrr" }, { t: "Largo e polimórfico", sec: 1, log: "TV polimórfica", ir: "desf" }], ref: "AHA 2025, Figura 6 (ACLS-F p. 4)" },

      ade12: { e: 2, tipo: "med", med: "adenosina12", ir: "rev2" },

  }, {
